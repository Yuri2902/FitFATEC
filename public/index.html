<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Início — FitFATEC</title>
  <link rel="stylesheet" href="CSS.css">
  <link rel="stylesheet" href="kiara-ajustes.css">
  <script src="visual.js" defer></script>
  <script src="planos-ui.js" defer></script>
  <link rel="stylesheet" href="/sidebar.css">
  <script src="/sidebar.js" defer></script>
</head>
<body class="fit-sidebar-layout" data-active-page="home">
<aside id="fitSidebar" class="fit-sidebar" aria-label="Navegação principal"></aside>
<button type="button" id="sidebarBackdrop" class="sidebar-backdrop" tabindex="-1" aria-label="Fechar menu lateral"></button>

<main class="fit-container fit-chat-home">
  <!-- COLUNA CENTRO (CHAT KIARA) -->
  <section class="chat">
    <div class="informacoes-kiara">
      <div class="kiara-header-left">
        <img src="img/kiara-logo.png" alt="Kiara" class="kiara-avatar-circle">
        <div class="kiara-title-group">
          <strong>Kiara</strong>
          <span>• Assistente FitFATEC</span>
        </div>
      </div>
      <div class="kiara-header-actions">
        <span class="fit-status-pill" id="indicadorModoIA" role="status" aria-live="polite">IA: aguardando</span>
        <nav class="kiara-quick-links" aria-label="Acessos rápidos da Kiara">
          <a href="/pages/treinos.html">Meus treinos</a>
          <a href="/pages/agendamentos.html">Agendamentos</a>
        </nav>
        <button type="button" id="limparConversa" class="kiara-clear" title="Limpar histórico da conversa" aria-label="Limpar conversa">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 6h18M8 6V4h8v2M5 6l1 15h12l1-15M10 10v8M14 10v8"/></svg>
          <span>Limpar conversa</span>
        </button>
      </div>
    </div>

    <div id="mensagens" aria-live="polite">
      <div class="msg bot">Oi! Eu sou a Kiara, sua assistente virtual da FitFATEC. 👋
Aqui você pode gerar treinos, programar seus treinos, acompanhar seus resultados e tirar dúvidas sobre os treinos e exercícios.

Como posso te ajudar hoje?</div>
    </div>

    <div class="sugestoes">
      <button type="button" class="chip" onclick="enviarKiara('Gerar novo treino')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6.5 6.5v11M17.5 6.5v11M3 9v6M21 9v6M6.5 12h11"/></svg>
        Gerar treino
      </button>
      <button type="button" class="chip" onclick="window.abrirPlanoSemanal?.()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="3" y1="10" x2="21" y2="10"/><path d="M8 2v4M16 2v4"/></svg>
        Gerar plano semanal
      </button>
    </div>

    <form id="formChat">
      <input id="pergunta" type="text" placeholder="Digite sua mensagem..." autocomplete="off" required>
      <button id="enviar" type="submit" class="fit-btn-primary">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
        Enviar
      </button>
    </form>
  </section>

</main>

<script>
  function enviarKiara(texto) {
    document.getElementById('pergunta').value = texto;
    document.getElementById('formChat').requestSubmit();
  }

</script>
</body>
</html>
